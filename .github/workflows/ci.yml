# CI — the two repo gates on every push and PR (S-1.9 / A-1.9).
# `pnpm lint` and `pnpm test` are the same commands AGENTS.md tells a contributor to run locally,
# so a green check here means the README's quickstart works on a clean Linux checkout.
# Toolchain versions are pinned by measurement, not by taste: cargo-near 0.22.0 is the version `main`
# was built and tested with, fetched by tag with its release sha256 verified before the binary is put
# on PATH. The one asset has two routes because github.com's release-download route was answering 504;
# whichever route brings the bytes, the digest is what decides whether they run. The sandbox node version
# comes from the `near-sandbox` crate itself (2.14.0), so it moves with Cargo.lock rather than this file.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_NEAR_VERSION: 0.22.0
  CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
  # The release asset for the version above, from `gh api repos/near/cargo-near/releases/tags/...`.
  # A second way to reach the same bytes, not a second thing being trusted: the sha256 still decides.
  CARGO_NEAR_ASSET_ID: 477230462

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: setup-node's `cache: pnpm` needs the binary to locate the store.
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: "rustfmt, clippy" }

      # One entry per Cargo.lock state, keyed so a rebuild only happens when the lockfile changes.
      # `target` is ~4 GB here (debug + the two release wasm builds), and GitHub gives a repository
      # 10 GB of cache total, so the key deliberately excludes the commit SHA: an exact-key hit means
      # the post step does not re-upload, and the repo cannot evict its own cache every push.
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/ci.yml') }}

      - name: Install cargo-near (pinned, digest-checked)
        run: |
          set -euo pipefail
          asset="cargo-near-x86_64-unknown-linux-gnu"
          # Two routes to the one pinned asset. The release URL is the normal one; the release API serves
          # the same bytes by asset id, which is the fallback measured on 2026-11-08 when github.com's
          # release-download route answered 504 on three CI attempts and three local fetches (`curl
          # --retry-all-errors` covers the transient half of that, the fallback the persistent half).
          release_url="https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/${asset}.tar.gz"
          api_url="https://api.github.com/repos/near/cargo-near/releases/assets/${CARGO_NEAR_ASSET_ID}"
          fetch() { curl -fsSL --retry 4 --retry-all-errors --retry-delay 20 --max-time 300 -o cargo-near.tar.gz "$@"; }
          if ! fetch "$release_url"; then
            echo "the release URL is unavailable; fetching the same asset from the release API" >&2
            fetch --header 'Accept: application/octet-stream' "$api_url"
          fi
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "$asset/cargo-near"
          cargo near --version

      # The near-sandbox node is NOT cached separately. `near-sandbox` 0.4.0 without its
      # `global_install` feature unpacks the 70 MB binary into `OUT_DIR`, i.e.
      # `target/debug/build/near-sandbox-*/out/.near/near-sandbox-2.14.0/`, so the `target` path in
      # the cache step above already covers it. (A `~/.near` cache step here would restore and save
      # nothing — measured on the first run of this workflow.)
      - run: pnpm install --frozen-lockfile

      # fmt + clippy (--all-targets) + eslint + tsc
      - run: pnpm lint

      # Builds both contracts with cargo-near, runs the Rust unit tests and the near-sandbox
      # integration suite, then every TypeScript package's tests.
      - run: pnpm test
